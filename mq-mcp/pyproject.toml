[project]
name = "mq-mcp"
version = "2.0.2"
description = "Local MCP server experiments and tooling for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upper bound, not a preference: mcp 2.0 removed mcp.server.fastmcp, which
    # server.py imports FastMCP from. uv.lock already held us at 1.27.1, but a
    # lock is a record of one resolution, not a rule — regenerating it against
    # an open `>=` would have pulled 2.x and taken the server down. This is the
    # same break that left mq-image-analyze red for nine days.
    # Migrating to the 2.x API is coordinated work: MCamner/mq-image-analyze#13.
    "mcp[cli]>=1.27.1,<2",
    "jsonschema>=4.26.0",
    "openai>=2.36.0",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pyguitarpro>=0.11",
    "python-dotenv>=1.0.0",
    "requests>=2.34.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.16.0",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
mq-mcp = "main:main"

[tool.mypy]
python_version = "3.11"
warn_return_any = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Defer legacy readability/style cleanup until it can be reviewed separately.
ignore = ["E701", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"server.py" = ["E402"]
"../tests/*.py" = ["E402"]

[[tool.mypy.overrides]]
module = ["psutil", "guitarpro", "pandas", "pandas.*"]
ignore_missing_imports = true
